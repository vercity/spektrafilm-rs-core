[package]
name = "spektrafilm-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
libraw = ["dep:cc", "dep:pkg-config"]
precision-f64 = ["spektrafilm-math/precision-f64"]

[dependencies]
anyhow.workspace = true
chrono = "0.4"
exr.workspace = true
image.workspace = true
lensfun = "=0.7.0"
moxcms = "0.8"
png = "0.18"
rawler = "0.7"
rayon.workspace = true
roxmltree = "0.20"
spektrafilm-math.workspace = true
tiff = "0.10"

[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }
