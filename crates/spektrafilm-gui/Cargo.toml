[package]
name = "spektrafilm-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "spektrafilm-gui"
path = "src/main.rs"

[features]
exiv2 = ["spektrafilm-io/exiv2"]
libraw = ["spektrafilm-io/libraw"]
precision-f64 = [
    "spektrafilm-math/precision-f64",
    "spektrafilm-core/precision-f64",
    "spektrafilm-gpu/precision-f64",
    "spektrafilm-io/precision-f64",
]

[dependencies]
spektrafilm-core.workspace = true
spektrafilm-gpu.workspace = true
spektrafilm-io.workspace = true
spektrafilm-math.workspace = true
eframe.workspace = true
egui.workspace = true
image.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = "0.15"
rayon.workspace = true
raw-window-handle = "0.6"
tempfile = "3"

# macOS-only: tag the CAMetalLayer's colorspace as sRGB so the OS
# colour-manages the window correctly on wide-gamut external displays.
# Without this, the framebuffer is treated as raw display primaries and
# sRGB content is rendered into the wider gamut → oversaturated reds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
core-graphics = "0.24"
foreign-types = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_UI_ColorSystem"] }
